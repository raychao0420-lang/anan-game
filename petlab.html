<meta charset="utf-8">
<title>寵物實驗室</title>
<style>
  body { margin: 0; background: #EADFC8; font-family: system-ui, "Noto Sans TC", sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 12px;
    display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap;
    background: rgba(255, 255, 255, .82); color: #5A4632; font-weight: 700;
  }
  #bar button {
    border: none; border-radius: 18px; height: 34px; padding: 0 14px;
    background: #fff; color: #5A4632; font-weight: 700; font-size: .9rem;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .18); cursor: pointer;
  }
  #bar button.on { background: #C8844A; color: #fff; }
  #who { min-width: 9.5em; text-align: center; font-size: 1.05rem; }
  #hint { position: fixed; top: 10px; left: 12px; color: #8A7A63; font-size: .8rem; }
</style>
<canvas id="c"></canvas>
<div id="hint">← → 換寵物　空白鍵坐下</div>
<div id="bar">
  <button id="prev">← 上一隻</button>
  <span id="who"></span>
  <button id="next">下一隻 →</button>
  <button id="spin">轉一圈</button>
  <button id="sit">坐下</button>
  <button id="stage">階段 1</button>
  <button id="zoom">遊戲大小</button>
</div>
<script type="module">
  import * as THREE from 'three'
  import { buildPet } from '/src/three/petMesh.js'

  // 開發時看模型用的頁面：相機與燈光完全比照 engine.js，
  // 所以這裡看到的比例／描邊粗細＝遊戲裡真正的樣子。
  const CAM_DIR = new THREE.Vector3(6, 7.5, 9).normalize()
  const PETS = [
    ['lulu', 'LULU 米格魯'], ['xiaohu', '小虎 臘腸狗'], ['hana', 'Hana 水獺'], ['kotaro', 'Kotaro 水獺'],
    ['jiji', '吉吉 貓'], ['kitsune', 'Yuki 雪狐'], ['raccoon', '麻吉 浣熊'], ['beaver', '阿丁 河狸'],
    ['hamster', '小麥 倉鼠'], ['seal', '圓圓 海豹'], ['penguin', '波波 企鵝'], ['owl', '嚕嚕 貓頭鷹'],
    ['xiaoq', '小Q 貓頭鷹'], ['mejiro', '小綠 綠繡眼'], ['feifei', '飛飛 信天翁'], ['dino', '豆豆 恐龍'],
    ['monkey', '皮皮 猴子'], ['twinkle', '小星'], ['luna', '小月'], ['pluto', '小冥'], ['arong', '阿榕 樹靈'],
  ]

  const canvas = document.getElementById('c')
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true })
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
  renderer.outputColorSpace = THREE.SRGBColorSpace

  const scene = new THREE.Scene()
  scene.background = new THREE.Color('#EADFC8')
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100)

  const key = new THREE.DirectionalLight(0xffffff, 1.5)
  key.position.set(5, 10, 6)
  const fill = new THREE.DirectionalLight(0xffffff, 0.5)
  fill.position.set(-6, 4, -4)
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 1.5), key, fill)

  const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshBasicMaterial({ color: '#DCCFB2' }))
  floor.rotation.x = -Math.PI / 2
  scene.add(floor)

  const q = new URLSearchParams(location.search)
  const S = {
    i: Math.max(0, PETS.findIndex(([id]) => id === (q.get('pet') || 'lulu'))),
    stage: Number(q.get('stage') || 1),
    sit: q.get('sit') === '1',
    spin: false,
    gameSize: false,
    turn: Number(q.get('turn') || 0) * Math.PI / 180,
  }

  let pet = null
  function rebuild() {
    if (pet) scene.remove(pet)
    const [id, label] = PETS[S.i]
    pet = buildPet(id, S.stage)
    if (S.sit) applySit(pet)
    scene.add(pet)
    document.getElementById('who').textContent = `${S.i + 1}/${PETS.length}　${label}`
    document.getElementById('stage').textContent = `階段 ${S.stage}`
    for (const [el, on] of [['sit', S.sit], ['spin', S.spin], ['zoom', S.gameSize]]) {
      document.getElementById(el).classList.toggle('on', on)
    }
    document.title = `寵物實驗室 — ${label}`
  }

  // 靜態擺出坐姿，數值與 RoomWorld3D 的動畫一致（那邊改了這裡也要跟著改）
  function applySit(g) {
    const p = g.userData.parts
    if (!p?.canSit) return
    p.body.position.y = -(g.userData.height || 0.6) * 0.08
    p.body.rotation.x = -0.38
    p.head.rotation.x = 0.22
    if (p.tail) p.tail.rotation.x = 0.3
    for (const leg of p.legs) {
      const front = leg.userData.front
      leg.rotation.x = front ? 0.38 : -0.41
      if (leg.userData.knee) leg.userData.knee.rotation.x = front ? 0.1 : 1.6
    }
  }

  const step = (d) => { S.i = (S.i + d + PETS.length) % PETS.length; S.turn = 0; rebuild() }
  document.getElementById('prev').onclick = () => step(-1)
  document.getElementById('next').onclick = () => step(1)
  document.getElementById('sit').onclick = () => { S.sit = !S.sit; rebuild() }
  document.getElementById('spin').onclick = () => { S.spin = !S.spin; rebuild() }
  document.getElementById('stage').onclick = () => { S.stage = S.stage % 4 + 1; rebuild() }
  document.getElementById('zoom').onclick = () => { S.gameSize = !S.gameSize; rebuild(); resize() }
  addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') step(-1)
    else if (e.key === 'ArrowRight') step(1)
    else if (e.key === ' ') { e.preventDefault(); S.sit = !S.sit; rebuild() }
  })

  function resize() {
    const view = S.gameSize ? 7.2 : 1.9      // 7.2＝遊戲裡的真實大小
    const w = innerWidth, h = innerHeight
    camera.left = -view * (w / h) / 2; camera.right = view * (w / h) / 2
    camera.top = view / 2; camera.bottom = -view / 2
    camera.position.copy(CAM_DIR).multiplyScalar(20)
    camera.lookAt(0, S.gameSize ? 0.1 : 0.35, 0)
    camera.updateProjectionMatrix()
    renderer.setSize(w, h, false)
  }
  addEventListener('resize', resize)

  rebuild()
  resize()
  // 轉頭示範（貓頭鷹）：遊戲裡只會出現已解鎖的寵物，所以在這裡也重現一次，
  // 沒解鎖貓頭鷹的人才看得到這個動作。節奏與 RoomWorld3D 一致（那邊改了這裡也要跟著改）。
  const HT_HOLD = 2.2, HT_SNAP = 11
  let htGoal = 0, htNow = 0, htNext = HT_HOLD, htLast = 0
  renderer.setAnimationLoop((ms) => {
    const t = ms / 1000
    const dt = Math.min(0.05, t - htLast); htLast = t
    const parts = pet?.userData.parts
    if (parts?.headTurn) {
      if (t > htNext) { htGoal = htGoal ? 0 : 2.2; htNext = t + HT_HOLD }
      htNow += (htGoal - htNow) * Math.min(dt * HT_SNAP, 1)
      parts.head.rotation.y = htNow
    } else { htGoal = 0; htNow = 0; htNext = t + HT_HOLD }
    if (pet) pet.rotation.y = Math.atan2(CAM_DIR.x, CAM_DIR.z) + S.turn + (S.spin ? t * 0.7 : 0)
    renderer.render(scene, camera)
  })
</script>
